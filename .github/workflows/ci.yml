name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm install -g @anthropic-ai/claude-code@2.1.283
      - run: npm run validate:plugin
        env:
          CLAUDE_CODE_ENABLE_FUNCTION_HOOKS: "1"

  release:
    name: release
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Read main's manifest
        run: |
          set -euo pipefail
          f=plugins/effort-live-control/.claude-plugin/plugin.json
          git rev-parse --verify -q origin/main >/dev/null || { echo "origin/main is missing from the checkout"; exit 1; }
          if git cat-file -e "origin/main:$f"; then
            git show "origin/main:$f" > /tmp/main-plugin.json
          else
            echo "main has no $f: treating this as the first release"
            echo '{"version":"0.0.0"}' > /tmp/main-plugin.json
          fi
      - run: scripts/release-check.sh "$(node -p 'require("/tmp/main-plugin.json").version')"
